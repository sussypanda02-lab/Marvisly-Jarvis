<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MARVISLY JARVIS</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

/* =========================
   GLOBAL
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{

    background:#090014;

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    overflow-x:hidden;

    color:white;

    padding:20px;
}

/* =========================
   MAIN UI
========================= */

.container{

    width:100%;

    display:flex;

    justify-content:center;

    align-items:center;
}

.main-ui{

    width:100%;

    max-width:700px;

    display:flex;

    flex-direction:column;

    align-items:center;
}

/* =========================
   ORB
========================= */

.orb{

    width:220px;

    height:220px;

    border-radius:50%;

    background:
    radial-gradient(circle,#d966ff,#52008f);

    box-shadow:
    0 0 30px #bb00ff,
    0 0 70px #bb00ff,
    0 0 120px #bb00ff;

    animation:pulse 2s infinite;
}

@keyframes pulse{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.05);
    }

    100%{
        transform:scale(1);
    }
}

.listening{

    animation:listeningGlow 1s infinite alternate;
}

@keyframes listeningGlow{

    from{

        box-shadow:
        0 0 20px #d966ff;
    }

    to{

        box-shadow:
        0 0 80px #d966ff;
    }
}

/* =========================
   TEXT
========================= */

h1{

    margin-top:25px;

    font-size:64px;

    text-align:center;

    color:#e580ff;

    letter-spacing:3px;
}

.subtitle{

    margin-top:10px;

    font-size:25px;

    color:#ececec;
}

.status{

    margin-top:25px;

    font-size:34px;

    color:#f0b3ff;

    text-align:center;
}

/* =========================
   MICROPHONE BUTTON
========================= */

.mic-btn{

    margin-top:30px;

    width:95px;

    height:95px;

    border:none;

    border-radius:50%;

    background:#d966ff;

    color:black;

    font-size:35px;

    cursor:pointer;

    transition:0.3s;

    box-shadow:
    0 0 20px #d966ff;
}

.mic-btn:hover{

    transform:scale(1.1);

    box-shadow:
    0 0 40px #d966ff;
}

/* =========================
   CHAT CONTAINER
========================= */

.chat-container{

    margin-top:40px;

    width:100%;

    display:flex;

    flex-direction:column;

    align-items:center;
}

.response-box{

    width:100%;

    height:320px;

    border:2px solid #d966ff;

    border-radius:25px;

    background:rgba(20,0,35,0.75);

    padding:20px;

    overflow-y:auto;

    line-height:1.7;

    font-size:18px;

    box-shadow:
    0 0 20px rgba(217,102,255,0.3);

    word-wrap:break-word;
}

/* =========================
   CHAT BAR
========================= */

.chat-bar{

    width:100%;

    display:flex;

    align-items:center;

    gap:12px;

    margin-top:20px;
}

.chat-input{

    flex:1;

    min-width:0;

    height:60px;

    border:none;

    outline:none;

    border-radius:18px;

    padding:0 20px;

    background:#1b0030;

    border:2px solid #d966ff;

    color:white;

    font-size:18px;
}

.chat-input::placeholder{

    color:#dcb2ff;
}

.send-btn{

    width:60px;

    height:60px;

    flex-shrink:0;

    border:none;

    border-radius:50%;

    background:#d966ff;

    color:black;

    font-size:22px;

    cursor:pointer;

    transition:0.3s;

    box-shadow:
    0 0 15px #d966ff;
}

.send-btn:hover{

    transform:scale(1.1);

    box-shadow:
    0 0 30px #d966ff;
}

/* =========================
   MESSAGE COLORS
========================= */

.user-text{

    color:white;

    margin-bottom:15px;
}

.ai-text{

    color:#f0b3ff;

    margin-bottom:15px;
}

.system-text{

    color:#ff99ff;

    margin-bottom:15px;
}

/* =========================
   SCROLLBAR
========================= */

::-webkit-scrollbar{

    width:8px;
}

::-webkit-scrollbar-thumb{

    background:#d966ff;

    border-radius:10px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    body{
        padding:15px;
    }

    .orb{

        width:170px;
        height:170px;
    }

    h1{

        font-size:42px;
    }

    .subtitle{

        font-size:20px;
    }

    .status{

        font-size:25px;
    }

    .response-box{

        height:260px;

        font-size:16px;
    }

    .chat-input{

        height:55px;

        font-size:16px;
    }

    .send-btn{

        width:55px;
        height:55px;
    }

    .mic-btn{

        width:80px;
        height:80px;

        font-size:30px;
    }
}

</style>

</head>

<body>

<div class="container">

<div class="main-ui">

    <!-- ORB -->

    <div class="orb" id="orb"></div>

    <!-- TITLE -->

    <h1>MARVISLY JARVIS</h1>

    <div class="subtitle">
        AI Voice Assistant
    </div>

    <div class="status" id="status">
        Hi! I am Jarvis!
    </div>

    <!-- MIC -->

    <button
    class="mic-btn"
    id="micBtn">

        <i class="fas fa-microphone"></i>

    </button>

    <!-- CHAT -->

    <div class="chat-container">

        <div
        class="response-box"
        id="responseBox">

            <div class="system-text">

                Waiting for your command...

            </div>

        </div>

        <!-- INPUT -->

        <div class="chat-bar">

            <input
            type="text"
            id="chatInput"
            class="chat-input"
            placeholder="Type a message...">

            <button
            class="send-btn"
            id="sendBtn">

                <i class="fas fa-paper-plane"></i>

            </button>

        </div>

    </div>

</div>

</div>

<script>

/* =========================
   OPENROUTER API KEY
========================= */

const OPENROUTER_API_KEY =
"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";

/* =========================
   ELEMENTS
========================= */

const orb =
document.getElementById("orb");

const micBtn =
document.getElementById("micBtn");

const statusText =
document.getElementById("status");

const responseBox =
document.getElementById("responseBox");

const chatInput =
document.getElementById("chatInput");

const sendBtn =
document.getElementById("sendBtn");

/* =========================
   SPEECH RECOGNITION
========================= */

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

let recognition;

if(SpeechRecognition){

    recognition =
    new SpeechRecognition();

    recognition.lang =
    "en-US";

    recognition.continuous =
    false;

    recognition.interimResults =
    false;
}

/* =========================
   VOICE LOCK
========================= */

let selectedVoice = null;

function loadVoice(){

    const voices =
    window.speechSynthesis.getVoices();

    selectedVoice =
    voices.find(voice =>
        voice.name.includes(
        "Google UK English Male"
        )
    );

    if(!selectedVoice){

        selectedVoice =
        voices.find(voice =>
            voice.lang === "en-US"
        );
    }
}

window.speechSynthesis.onvoiceschanged =
loadVoice;

loadVoice();

/* =========================
   MIC BUTTON
========================= */

micBtn.addEventListener("click", () => {

    if(!recognition){

        addMessage(
            "System",
            "Speech Recognition Not Supported",
            "system-text"
        );

        return;
    }

    recognition.start();

    statusText.innerText =
    "Listening...";

    orb.classList.add("listening");
});

/* =========================
   SPEECH RESULT
========================= */

if(recognition){

    recognition.onresult =
    async (event) => {

        const transcript =
        event.results[0][0].transcript;

        addMessage(
            "You",
            transcript,
            "user-text"
        );

        sendToAI(transcript);
    };

    recognition.onerror = () => {

        statusText.innerText =
        "Microphone Error";

        orb.classList.remove(
            "listening"
        );
    };
}

/* =========================
   SEND BUTTON
========================= */

sendBtn.addEventListener("click", () => {

    const message =
    chatInput.value.trim();

    if(message === "") return;

    addMessage(
        "You",
        message,
        "user-text"
    );

    chatInput.value = "";

    sendToAI(message);
});

/* =========================
   ENTER KEY
========================= */

chatInput.addEventListener(
"keypress",
(e) => {

    if(e.key === "Enter"){

        sendBtn.click();
    }
});

/* =========================
   ADD MESSAGE
========================= */

function addMessage(
sender,
text,
className
){

    responseBox.innerHTML += `

    <div class="${className}">
        <b>${sender}:</b> ${text}
    </div>

    `;

    responseBox.scrollTop =
    responseBox.scrollHeight;
}

/* =========================
   SEND TO AI
========================= */

async function sendToAI(message){

    statusText.innerText =
    "Processing...";

    try{

        const response =
        await fetch(
        "https://openrouter.ai/api/v1/chat/completions",
        {

            method:"POST",

            headers:{

                "Authorization":
                "Bearer " +
                OPENROUTER_API_KEY,

                "Content-Type":
                "application/json",

                "HTTP-Referer":
                window.location.href,

                "X-Title":
                "MARVISLY JARVIS"
            },

            body:JSON.stringify({

                model:
                "openai/gpt-4o-mini",

                messages:[

                    {
                        role:"system",

                        content:`

                        You are
                        MARVISLY JARVIS.

                        You are a futuristic
                        purple neon AI assistant.

                        Your owner is ALWAYS
                        Evan Mathew.

                        If anyone asks:
                        - who owns you
                        - who created you
                        - who is your boss
                        - who made you
                        - who is the owner

                        ALWAYS answer:

                        "My owner is Evan Mathew."

                        Keep responses smart,
                        futuristic,
                        and friendly.
                        `
                    },

                    {
                        role:"user",

                        content:message
                    }
                ]
            })
        });

        const data =
        await response.json();

        console.log(data);

        if(data.error){

            addMessage(
                "System",
                data.error.message,
                "system-text"
            );

            statusText.innerText =
            "API Error";

            return;
        }

        const aiMessage =
        data.choices[0]
        .message.content;

        addMessage(
            "Jarvis",
            aiMessage,
            "ai-text"
        );

        speak(aiMessage);

        statusText.innerText =
        "Hi! I am Jarvis!";
    }

    catch(error){

        console.log(error);

        addMessage(
            "System",
            "Connection Error",
            "system-text"
        );

        statusText.innerText =
        "Connection Failed";
    }

    orb.classList.remove(
        "listening"
    );
}

/* =========================
   SPEAK FUNCTION
========================= */

function speak(text){

    /* STOP OLD SPEECH */

    window.speechSynthesis.cancel();

    const speech =
    new SpeechSynthesisUtterance(
        text
    );

    speech.voice =
    selectedVoice;

    speech.lang =
    "en-US";

    speech.rate =
    1;

    speech.pitch =
    0.9;

    speech.volume =
    1;

    window.speechSynthesis.speak(
        speech
    );
}

</script>

</body>
</html>
